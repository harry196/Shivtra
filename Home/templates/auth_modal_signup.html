{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | SHIV SHAKTI TOUR AND TRAVEL</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #fafafa;
            min-height: 100vh;
            display: flex;
        }

        .container {
            display: flex;
            width: 100%;
            min-height: 100vh;
        }

        /* Left Panel - Illustration */
        .left-panel {
            display: none;
            width: 50%;
            background: #f0f0f0;
            position: relative;
            overflow: hidden;
            align-items: center;
            justify-content: center;
        }

        @media (min-width: 1024px) {
            .left-panel {
                display: flex;
            }
        }

        .blob-container {
            position: relative;
            width: 320px;
            height: 320px;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
        }

        .blob-orange {
            width: 180px;
            height: 180px;
            background: linear-gradient(135deg, #f97316, #fb923c);
            top: 20px;
            left: 80px;
            animation: float 6s ease-in-out infinite;
        }

        .blob-purple {
            width: 140px;
            height: 140px;
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            bottom: 40px;
            left: 40px;
            animation: float-delayed 5s ease-in-out infinite;
        }

        .blob-yellow {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #eab308, #facc15);
            bottom: 80px;
            right: 40px;
            animation: float 7s ease-in-out infinite;
        }

        .blob-black {
            width: 120px;
            height: 120px;
            background: #1f1f1f;
            top: 100px;
            left: 20px;
            animation: float-delayed 6s ease-in-out infinite;
        }

        .face {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .eye {
            width: 12px;
            height: 12px;
            background: white;
            border-radius: 50%;
            animation: blink 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(3deg); }
        }

        @keyframes float-delayed {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(-2deg); }
        }

        @keyframes blink {
            0%, 90%, 100% { transform: scaleY(1); }
            95% { transform: scaleY(0.1); }
        }

        /* Right Panel - Form */
        .right-panel {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background: #fafafa;
        }

        @media (min-width: 1024px) {
            .right-panel {
                width: 50%;
            }
        }

        .form-container {
            width: 100%;
            max-width: 400px;
        }

        .logo {
            display: flex;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .logo svg {
            width: 24px;
            height: 24px;
            color: #141414;
        }

        .heading {
            text-align: center;
            margin-bottom: 2rem;
        }

        .heading h1 {
            font-size: 1.875rem;
            font-weight: 600;
            color: #141414;
            margin-bottom: 0.5rem;
        }

        .heading p {
            color: #737373;
            font-size: 0.875rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            color: #737373;
            margin-bottom: 0.5rem;
        }

        .form-group input {
            width: 100%;
            height: 48px;
            padding: 0 1rem;
            border: 1px solid #e5e5e5;
            border-radius: 0.75rem;
            font-size: 0.875rem;
            background: #fafafa;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #141414;
            box-shadow: 0 0 0 3px rgba(20, 20, 20, 0.1);
        }

        .form-group input::placeholder {
            color: #a3a3a3;
        }

        .password-wrapper {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #737373;
            transition: color 0.2s;
        }

        .password-toggle:hover {
            color: #141414;
        }

        .terms {
            display: flex;
            align-items: flex-start;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .terms input[type="checkbox"] {
            width: 16px;
            height: 16px;
            margin-top: 2px;
            accent-color: #141414;
        }

        .terms label {
            font-size: 0.875rem;
            color: #737373;
            line-height: 1.4;
        }

        .terms a {
            color: #141414;
            text-decoration: none;
            font-weight: 500;
        }

        .terms a:hover {
            text-decoration: underline;
        }

        .btn-primary {
            width: 100%;
            height: 48px;
            background: #141414;
            color: white;
            border: none;
            border-radius: 0.75rem;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s;
        }

        .btn-primary:hover {
            background: #2a2a2a;
        }

        .btn-google {
            width: 100%;
            height: 48px;
            background: transparent;
            border: 1px solid #e5e5e5;
            border-radius: 0.75rem;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            margin-top: 0.75rem;
            transition: background 0.2s;
        }

        .btn-google:hover {
            background: #f5f5f5;
        }

        .btn-google svg {
            width: 20px;
            height: 20px;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 1.5rem 0;
            color: #a3a3a3;
            font-size: 0.75rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e5e5e5;
        }

        .divider span {
            padding: 0 1rem;
        }

        .login-link {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.875rem;
            color: #737373;
        }

        .login-link a {
            color: #141414;
            font-weight: 500;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .error-message {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Left Panel - Illustration -->
        <div class="left-panel">
            <div class="blob-container">
                <div class="blob blob-orange">
                    <div class="face">
                        <div class="eye"></div>
                        <div class="eye"></div>
                    </div>
                </div>
                <div class="blob blob-purple"></div>
                <div class="blob blob-yellow"></div>
                <div class="blob blob-black">
                    <div class="face">
                        <div class="eye"></div>
                        <div class="eye"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Panel - Signup Form -->
        <div class="right-panel">
            <div class="form-container">
                <!-- Logo -->
                <div class="logo">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <path d="M12 2L12 12M12 12L22 12M12 12L2 12M12 12L12 22"/>
                    </svg>
                </div>

                <!-- Heading -->
                <div class="heading">
                    <h1>Create an account</h1>
                    <p>Start your journey with Shivtra</p>
                </div>

                <!-- Error Messages -->
                {% if messages %}
                    {% for message in messages %}
                        <div class="error-message">{{ message }}</div>
                    {% endfor %}
                {% endif %}

                <!-- Signup Form -->
                <form method="post" action="{% url 'account_signup' %}">
                    {% csrf_token %}
                    
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" placeholder="Enter your username" autocomplete="username" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Enter your email" autocomplete="email" required>
                    </div>

                    <div class="form-group">
                        <label for="password1">Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="password1" name="password1" placeholder="••••••••" minlength="6" autocomplete="new-password" required>
                            <button type="button" class="password-toggle" onclick="togglePassword('password1', this)">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password2">Confirm Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="password2" name="password2" placeholder="••••••••" minlength="6" autocomplete="new-password" required>
                            <button type="button" class="password-toggle" onclick="togglePassword('password2', this)">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="terms">
                        <input type="checkbox" id="terms" name="terms" required>
                        <label for="terms">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></label>
                    </div>

                    <button type="submit" class="btn-primary">
                      Create Account
                    </button>
                </form>

                <div class="divider"><span>or</span></div>

                <button type="button" class="btn-google">
                    <svg viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    Sign up with Google
                </button>

                <p class="login-link">
                    Already have an account? <a href="{% url 'login' %}">Log In</a>
                </p>
            </div>
        </div>
    </div>

    <script>
    function togglePassword(inputId) {
        const input = document.getElementById(inputId);
        input.type = input.type === 'password' ? 'text' : 'password';
    }
    </script>
</body>
</html>
